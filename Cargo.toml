[workspace]
members = ["crates/companion-core", "crates/companion-node", "crates/companion-chat", "crates/companion-secrets", "crates/companion-sync", "crates/companion-video"]
exclude = ["apps/companion/src-tauri", "plugins/companion-keystore"]
resolver = "2"

[workspace.package]
version = "0.0.7"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
rusqlite = { version = "=0.42.0", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
thiserror = "=2.0.21"

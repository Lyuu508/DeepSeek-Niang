name: Build Windows test package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure temporary build directory
        run: |
          ('CARGO_TARGET_DIR=' + (Join-Path $env:RUNNER_TEMP 'deepseek-windows-target')) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate packaging script
        run: |
          $Tokens = $null; $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD '.github/scripts/windows-package-smoke.ps1'), [ref]$Tokens, [ref]$ParseErrors) | Out-Null
          if ($ParseErrors.Count) { throw ($ParseErrors | Out-String) }
      - name: Select reviewed Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          rustup default 1.99.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      - name: Build and test locked source
        run: .\scripts\build-windows.ps1
      - name: Collect package and test installation
        run: .\.github\scripts\windows-package-smoke.ps1
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-package
          path: ${{ runner.temp }}/deepseek-windows-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

name: Verify signed Android upgrade
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit for the signed candidate
        required: true
        type: string
      staged_commit:
        description: Exact commit of the candidate staged for offline signing
        required: false
        type: string
      apk_sha256:
        description: Expected SHA-256 of the signed production APK
        required: false
        type: string
permissions:
  contents: read
jobs:
  emulator:
    if: github.event_name != 'workflow_dispatch' || inputs.staged_commit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_SERIAL: emulator-5554
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify authorized main source
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          mkdir -p "$RUNNER_TEMP/deepseek-android-upgrade"
          echo "EVIDENCE=$RUNNER_TEMP/deepseek-android-upgrade" >> "$GITHUB_ENV"
      - if: inputs.staged_commit == ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: android-package-*
          path: ${{ runner.temp }}/signed-package
      - if: inputs.staged_commit != ''
        name: Retrieve exact staged signed APK
        env:
          STAGED_COMMIT: ${{ inputs.staged_commit }}
          EXPECTED_HASH: ${{ inputs.apk_sha256 }}
        run: |
          [[ "$STAGED_COMMIT" =~ ^[a-f0-9]{40}$ && "$EXPECTED_HASH" =~ ^[0-9a-f]{64}$ ]]
          version=$(python3 -c 'import json; print(json.load(open("VERSION.json"))["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin "refs/heads/codex/v$version-release-inputs"
          [[ "$(git rev-parse FETCH_HEAD)" = "$STAGED_COMMIT" ]]
          mkdir -p "$RUNNER_TEMP/signed-package"
          git show "$STAGED_COMMIT:assets/DeepSeek-Niang_${version}_android-arm64.apk" > "$RUNNER_TEMP/signed-package/candidate.apk"
          printf '%s  %s\n' "$EXPECTED_HASH" "$RUNNER_TEMP/signed-package/candidate.apk" | sha256sum --check
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify both actual APKs against the production identity
        run: |
          mapfile -t apks < <(find "$RUNNER_TEMP/signed-package" -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" "$RUNNER_TEMP/candidate.apk"
          curl --fail --silent --show-error --location --retry 3 'https://github.com/Lyuu508/DeepSeek-Niang/releases/download/v0.0.1/DeepSeek-Niang_0.0.1_android-arm64.apk' --output "$RUNNER_TEMP/original.apk"
          python3 scripts/verify_android.py --reference-apk "$RUNNER_TEMP/original.apk" --output "$EVIDENCE/original.json"
          python3 scripts/verify_android.py --apk "$RUNNER_TEMP/candidate.apk" --output "$EVIDENCE/candidate.json"
      - name: Boot official Android 35 emulator with ARM translation
        run: |
          test -c /dev/kvm
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi
          image='system-images;android-35;google_apis;x86_64'
          sdkmanager --install emulator "$image"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd" ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          avdmanager create avd -n deepseek-upgrade -k "$image" -d pixel_7 -p "$ANDROID_AVD_HOME/deepseek-upgrade.avd" --force </dev/null
          if ! test -f "$ANDROID_AVD_HOME/deepseek-upgrade.ini"; then
            printf 'avd.ini.encoding=UTF-8\npath=%s/deepseek-upgrade.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/deepseek-upgrade.ini"
          fi
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd deepseek-upgrade -port 5554 -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 3072 -cores 2 > "$EVIDENCE/emulator.log" 2>&1 &
          pid=$!
          for attempt in {1..150}; do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null || true)" = 1 ]]; then break; fi
            kill -0 "$pid"
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed)" = 1
          adb shell svc power stayon true
          adb shell input keyevent 224
          adb shell wm dismiss-keyguard
          adb shell am force-stop com.google.android.apps.nexuslauncher
      - name: Upgrade in place and inspect native app UI
        run: python3 tests/android_upgrade.py "$RUNNER_TEMP/original.apk" "$RUNNER_TEMP/candidate.apk" "$EVIDENCE"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-upgrade-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: warn
          retention-days: 30
  acceptance-signer:
    if: github.event_name == 'workflow_dispatch' && inputs.staged_commit == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configured test certificate against public v0.1.1 identity
        env:
          CANDIDATE_KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE_B64 }}
          CANDIDATE_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          CANDIDATE_STORE_PASS: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          CANDIDATE_KEY_PASS: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          required = ['CANDIDATE_KEYSTORE','CANDIDATE_ALIAS','CANDIDATE_STORE_PASS','CANDIDATE_KEY_PASS']
          if not all(os.environ.get(name) for name in required):
              print('No complete stored Android test signing configuration.')
              raise SystemExit(0)
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as directory:
              key = Path(directory) / 'candidate.p12'
              key.write_bytes(base64.b64decode(os.environ['CANDIDATE_KEYSTORE'], validate=True))
              key.chmod(0o600)
              children = {name: value for name, value in os.environ.items() if name != 'CANDIDATE_KEYSTORE'}
              flags = ['-keystore', str(key), '-alias', os.environ['CANDIDATE_ALIAS'], '-storepass:env', 'CANDIDATE_STORE_PASS']
              cert = subprocess.run(['keytool', '-exportcert', *flags], env=children, capture_output=True)
              proof = subprocess.run(['keytool', '-certreq', *flags, '-keypass:env', 'CANDIDATE_KEY_PASS'], env=children, capture_output=True)
              if cert.returncode or proof.returncode:
                  raise SystemExit('Could not verify the stored Android test identity.')
              fingerprint = hashlib.sha256(cert.stdout).hexdigest()
              print('Test certificate SHA-256: ' + fingerprint)
              print('v0.1.1 acceptance signature matches: ' + str(fingerprint == '5d92ada7e0187559964c075fb7b285697f6b4357fcea877b5def20b7a15b6c12'))
          PY

name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling and dependencies
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          rustup default 1.99.0
          npm ci --ignore-scripts
      - name: Core, schema, policies, versions and frontend
        run: |
          evidence="$RUNNER_TEMP/deepseek-test-evidence"
          python3 scripts/run_logged.py "$evidence/version.txt" python3 scripts/version.py
          python3 scripts/run_logged.py "$evidence/rust-tests.txt" cargo test --workspace --locked
          python3 scripts/run_logged.py "$evidence/clippy.txt" cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/run_logged.py "$evidence/schema.txt" python3 scripts/check_schema.py
          python3 scripts/run_logged.py "$evidence/python-tests.txt" python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/run_logged.py "$evidence/sync-model.txt" node --test tests/sync-model.test.mjs
          python3 scripts/run_logged.py "$evidence/frontend.txt" npm run build
          python3 scripts/run_logged.py "$evidence/branding.txt" node scripts/check-branding.mjs
      - name: Browser regression tests (explicit fixture)
        env:
          COMPANION_TEST_ARTIFACT_DIR: ${{ runner.temp }}/deepseek-test-evidence/ui
        run: |
          npm exec --workspace @deepseek/companion -- playwright install --with-deps chromium
          python3 scripts/run_logged.py "$RUNNER_TEMP/deepseek-test-evidence/ui-tests.txt" npm run test:ui
          VITE_COMPANION_TEST_PACKAGE=1 COMPANION_TEST_ARTIFACT_DIR="$RUNNER_TEMP/deepseek-test-evidence/ui-isolated" python3 scripts/run_logged.py "$RUNNER_TEMP/deepseek-test-evidence/ui-isolated-tests.txt" npm run test:ui
      - name: Retain test reports and sanitized logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: automated-test-reports-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deepseek-test-evidence/
          if-no-files-found: warn
          retention-days: 30
  packages:
    uses: ./.github/workflows/native-packages.yml
    with:
      source_sha: ${{ github.sha }}
      signed_android: false

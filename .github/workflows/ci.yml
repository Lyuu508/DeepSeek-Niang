name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-readiness:
    # Presence only: no secret value is passed into the runner or printed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Record signing configuration presence without accessing values
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          HAS_TEST_BUNDLE: ${{ secrets.TEST_RELEASE_SIGNING_B64 != '' }}
          HAS_TEST_KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE_B64 != '' }}
          HAS_TEST_STORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD != '' }}
          HAS_TEST_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS != '' }}
          HAS_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD != '' }}
          HAS_WINDOWS_PFX: ${{ secrets.WINDOWS_TEST_PFX_B64 != '' }}
          HAS_WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_TEST_PFX_PASSWORD != '' }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          names={'ANDROID_KEYSTORE_B64':'HAS_KEYSTORE','ANDROID_KEYSTORE_PASSWORD':'HAS_STORE_PASSWORD','ANDROID_KEY_ALIAS':'HAS_ALIAS','ANDROID_KEY_PASSWORD':'HAS_KEY_PASSWORD','TEST_RELEASE_SIGNING_B64':'HAS_TEST_BUNDLE','ANDROID_TEST_KEYSTORE_B64':'HAS_TEST_KEYSTORE','ANDROID_TEST_KEYSTORE_PASSWORD':'HAS_TEST_STORE_PASSWORD','ANDROID_TEST_KEY_ALIAS':'HAS_TEST_ALIAS','ANDROID_TEST_KEY_PASSWORD':'HAS_TEST_KEY_PASSWORD','WINDOWS_TEST_PFX_B64':'HAS_WINDOWS_PFX','WINDOWS_TEST_PFX_PASSWORD':'HAS_WINDOWS_PFX_PASSWORD'}
          data={'source_commit':os.environ['GITHUB_SHA'],'secrets':{name:os.environ[var]=='true' for name,var in names.items()},'values_read_or_printed':False,'certificate_match_verified':False}
          path=Path(os.environ['RUNNER_TEMP'])/'signing-readiness.json';path.write_text(json.dumps(data,indent=2)+'\n')
          summary=['Android signing configuration presence only; names do not prove certificate continuity.']
          summary += [name+': '+('configured' if present else 'not configured for this run') for name,present in data['secrets'].items()]
          print('\n'.join(summary))
          print('::notice title=Android signing presence::'+json.dumps(data['secrets']))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:out.write('\n'.join(summary)+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signing-presence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signing-readiness.json
          retention-days: 30
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked tooling and dependencies
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          rustup default 1.99.0
          npm ci --ignore-scripts
      - name: Core, schema, policies, versions and frontend
        run: |
          evidence="$RUNNER_TEMP/deepseek-test-evidence"
          python3 scripts/run_logged.py "$evidence/version.txt" python3 scripts/version.py
          python3 scripts/run_logged.py "$evidence/rust-tests.txt" cargo test --workspace --locked
          python3 scripts/run_logged.py "$evidence/clippy.txt" cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/run_logged.py "$evidence/schema.txt" python3 scripts/check_schema.py
          python3 scripts/run_logged.py "$evidence/python-tests.txt" python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/run_logged.py "$evidence/sync-model.txt" node --test tests/sync-model.test.mjs
          python3 scripts/run_logged.py "$evidence/frontend.txt" npm run build
          python3 scripts/run_logged.py "$evidence/branding.txt" node scripts/check-branding.mjs
      - name: Browser regression tests (explicit fixture)
        env:
          COMPANION_TEST_ARTIFACT_DIR: ${{ runner.temp }}/deepseek-test-evidence/ui
        run: |
          npm exec --workspace @deepseek/companion -- playwright install --with-deps chromium
          python3 scripts/run_logged.py "$RUNNER_TEMP/deepseek-test-evidence/ui-tests.txt" npm run test:ui
          VITE_COMPANION_TEST_PACKAGE=1 COMPANION_TEST_ARTIFACT_DIR="$RUNNER_TEMP/deepseek-test-evidence/ui-isolated" python3 scripts/run_logged.py "$RUNNER_TEMP/deepseek-test-evidence/ui-isolated-tests.txt" npm run test:ui
      - name: Retain test reports and sanitized logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: automated-test-reports-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deepseek-test-evidence/
          if-no-files-found: warn
          retention-days: 30
  packages:
    uses: ./.github/workflows/native-packages.yml
    with:
      source_sha: ${{ github.sha }}
      signed_android: false
      android_compile_only: true
      fresh_test_identity: true

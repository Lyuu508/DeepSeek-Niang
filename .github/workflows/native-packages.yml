name: Build native packages
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      signed_android:
        type: boolean
        default: false
      android_compile_only:
        type: boolean
        default: false
      fresh_test_identity:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify hosted MSVC prerequisites and select Rust
        run: |
          $ParseTokens = $null
          $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD '.github/scripts/windows-test-sign.ps1'), [ref]$ParseTokens, [ref]$ParseErrors) | Out-Null
          if ($ParseErrors.Count -gt 0) { throw 'Signing PowerShell script has syntax errors' }
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE) { throw 'Rust install failed' }
          rustup default 1.99.0
          if ($LASTEXITCODE) { throw 'Rust selection failed' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (& $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)) { throw 'MSVC missing' }
          ('CARGO_TARGET_DIR=' + (Join-Path $env:RUNNER_TEMP 'deepseek-windows-target')) | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build locked Windows source and validate installer
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'deepseek-windows-artifacts'
          New-Item -ItemType Directory -Force $root | Out-Null
          Start-Transcript -Path (Join-Path $root 'windows-build.log')
          try {
            python scripts/version.py
            if ($LASTEXITCODE) { throw 'Version mismatch' }
            python scripts/run_logged.py (Join-Path $root 'windows-native-build.log') pwsh -NoProfile -File scripts/build-windows.ps1
            if ($LASTEXITCODE) { throw 'Windows native build/tests failed; see windows-native-build.log' }
            .\.github\scripts\windows-package-smoke.ps1
          } finally { Stop-Transcript }
      - name: Record source SHA and package hash
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'deepseek-windows-artifacts'
          $exe = @(Get-ChildItem $root -Filter '*setup.exe')
          if ($exe.Count -ne 1) { throw 'Expected one Windows installer' }
          $version = (Get-Content VERSION.json | ConvertFrom-Json).version
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SOURCE_SHA) { throw 'Windows source SHA differs from requested source' }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain | Out-String))) { throw 'Windows build changed source files' }
          @{ platform='windows'; source_commit=(git rev-parse HEAD); version=$version; file=$exe[0].Name; sha256=(Get-FileHash $exe[0].FullName -Algorithm SHA256).Hash.ToLower(); bytes=$exe[0].Length; working_tree_clean=([string]::IsNullOrWhiteSpace((git status --porcelain | Out-String))); hosted_runner_install_smoke=$true; physical_device_tested=$false } | ConvertTo-Json | Set-Content (Join-Path $root 'windows-build.json') -Encoding utf8
          Get-ChildItem $root -Filter '*.exe' | Sort-Object Name | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name } | Set-Content (Join-Path $root 'SHA256SUMS.txt') -Encoding utf8
      - if: always()
        id: windows_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deepseek-windows-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Link Windows installer evidence
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.windows_artifact.outputs.artifact-url }}
        run: |
          "Windows EXE installer, SHA256SUMS and native install smoke report: $env:ARTIFACT_URL" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android Command-line Tools and SDK paths
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install official Android components and Rust
        run: |
          mkdir -p "$RUNNER_TEMP/deepseek-android-artifacts"
          # pipefail keeps an SDK/toolchain failure fatal while retaining its log.
          {
            rustup toolchain install 1.99.0 --profile minimal
            rustup default 1.99.0
            test -x "$JAVA_HOME/bin/javac"
            "$JAVA_HOME/bin/java" -version
            "$JAVA_HOME/bin/javac" -version 2>&1 | grep -E '^javac 21\.'
            export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            SDKMANAGER="$(command -v sdkmanager)"
            test -x "$SDKMANAGER"
            echo "SDK manager: $(realpath "$SDKMANAGER")"
            echo "SDK root: $(realpath "$ANDROID_HOME")"
            sdkmanager --version
            sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'ndk;28.2.13676358'
            export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
            test -f "$ANDROID_HOME/platforms/android-36/android.jar"
            test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
            test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
            test -x "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
            grep -E '^Pkg.Revision *= *28\.2\.13676358$' "$NDK_HOME/source.properties"
            echo "NDK root: $(realpath "$NDK_HOME")"
            sdkmanager --sdk_root="$ANDROID_HOME" --list_installed
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
            dirname "$SDKMANAGER" >> "$GITHUB_PATH"
            echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          } 2>&1 | tee "$RUNNER_TEMP/deepseek-android-artifacts/android-toolchain.log"
      - name: Verify original certificate from the actual v0.0.1 APK
        if: inputs.signed_android
        run: |
          curl --fail --location --retry 3 'https://github.com/Lyuu508/DeepSeek-Niang/releases/download/v0.0.1/DeepSeek-Niang_0.0.1_android-arm64.apk' -o "$RUNNER_TEMP/deepseek-v0.0.1.apk"
          python3 scripts/verify_android.py --reference-apk "$RUNNER_TEMP/deepseek-v0.0.1.apk" --output "$RUNNER_TEMP/deepseek-android-artifacts/android-reference-signature.json"
      - name: Restore existing protected signing identity
        if: inputs.signed_android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          COMPANION_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          COMPANION_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          COMPANION_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names=['KEYSTORE_B64','COMPANION_ANDROID_KEYSTORE_PASSWORD','COMPANION_ANDROID_KEY_ALIAS','COMPANION_ANDROID_KEY_PASSWORD']
          missing=[n for n in names if not os.environ.get(n)]
          if missing: raise SystemExit('Original v0.0.1 Android signing secrets missing: '+', '.join(missing))
          path=Path(os.environ['RUNNER_TEMP'])/'deepseek-signing.jks'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_B64'],validate=True));path.chmod(0o600)
          os.environ['COMPANION_ANDROID_KEYSTORE_FILE']=str(path)
          import sys
          sys.path.insert(0,'scripts')
          import android_signing
          android_signing.preflight()
          PY
      - name: Build ARM64 APK
        env:
          SIGNED: ${{ inputs.signed_android }}
          COMPILE_ONLY: ${{ inputs.android_compile_only }}
          COMPANION_FRESH_TEST_IDENTITY: ${{ inputs.fresh_test_identity }}
          COMPANION_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/deepseek-signing.jks
          COMPANION_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          COMPANION_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          COMPANION_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 scripts/version.py
          mkdir -p "$RUNNER_TEMP/deepseek-android-artifacts"
          if [ "$SIGNED" = 'true' ]; then
            python3 scripts/run_logged.py "$RUNNER_TEMP/deepseek-android-artifacts/android-build.log" sh scripts/build-android.sh
            variant=release
            package_name="DeepSeek-Niang_$(python3 -c 'import json;print(json.load(open("VERSION.json"))["version"])')_android-arm64.apk"
            verify_mode=()
          elif [ "$COMPILE_ONLY" = 'true' ]; then
            python3 scripts/run_logged.py "$RUNNER_TEMP/deepseek-android-artifacts/android-build.log" sh scripts/build-android.sh --unsigned-test-ci
            variant=debug
            package_name="DeepSeek-Niang_$(python3 -c 'import json;print(json.load(open("VERSION.json"))["version"])')_android-arm64-test-update-unsigned-check.apk"
            verify_mode=(--unsigned-test-ci)
            if [ "$COMPANION_FRESH_TEST_IDENTITY" = 'true' ]; then verify_mode+=(--fresh-test-identity); fi
            echo '仅编译检查：未签名，不能安装，不能替换当前手机上的 0.0.2。等待相同签名后才交付手机更新。' > "$RUNNER_TEMP/deepseek-android-artifacts/ANDROID-DISTRIBUTION.txt"
          else
            python3 scripts/run_logged.py "$RUNNER_TEMP/deepseek-android-artifacts/android-build.log" sh scripts/build-android.sh --test-package
            variant=debug
            package_name="DeepSeek-Niang_$(python3 -c 'import json;print(json.load(open("VERSION.json"))["version"])')_android-arm64-isolated-test.apk"
            verify_mode=(--test-package)
          fi
          mapfile -t packages < <(find apps/companion/src-tauri/gen/android/app/build/outputs/apk -path "*/$variant/*.apk")
          test "${#packages[@]}" -eq 1
          cp "${packages[0]}" "$RUNNER_TEMP/deepseek-android-artifacts/$package_name"
          python3 scripts/verify_android.py "${verify_mode[@]}" --apk "$RUNNER_TEMP/deepseek-android-artifacts/$package_name" --output "$RUNNER_TEMP/deepseek-android-artifacts/android-build.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'deepseek-android-artifacts/android-build.json').read_text())
          assert report['source_commit']==os.environ['EXPECTED_SOURCE_SHA'], 'Android source SHA differs from requested source'
          assert report['working_tree_clean'], 'Android build changed source files'
          PY
          (cd "$RUNNER_TEMP/deepseek-android-artifacts" && sha256sum "$package_name" > SHA256SUMS.txt)
      - name: Remove private signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/deepseek-signing.jks"
      - if: always()
        id: android_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deepseek-android-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Link Android package evidence
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.android_artifact.outputs.artifact-url }}
          SIGNED: ${{ inputs.signed_android }}
          COMPILE_ONLY: ${{ inputs.android_compile_only }}
        run: |
          echo "APK, SHA256SUMS, signature/identity report and build log: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIGNED" != 'true' ] && [ "$COMPILE_ONLY" = 'true' ]; then
            echo 'Android compile check only: unsigned and not installable. No new signing identity or replacement APK is published.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SIGNED" != 'true' ]; then
            echo 'Isolated development test APK: io.local.deepseekcompanion.test. Separate data; cannot replace v0.0.1. Development signer may change between runners. Physical-device LAN acceptance is pending.' >> "$GITHUB_STEP_SUMMARY"
          fi

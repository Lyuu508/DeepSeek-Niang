[package]
name = "companion-chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
companion-core = { path = "../companion-core" }
companion-secrets = { path = "../companion-secrets" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
futures-util = "=0.3.34"

[dev-dependencies]
uuid.workspace = true

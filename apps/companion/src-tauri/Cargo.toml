[package]
name = "companion-app"
version = "0.0.6"
edition = "2024"
rust-version = "1.99"
publish = false

# Keep platform SDK dependency resolution outside the headless core workspace.
[workspace]

[lib]
name = "companion_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
companion-core = { path = "../../../crates/companion-core" }
companion-chat = { path = "../../../crates/companion-chat" }
companion-secrets = { path = "../../../crates/companion-secrets" }
tauri-plugin-companion-keystore = { path = "../../../plugins/companion-keystore" }
uuid = { version = "=1.29.2", features = ["v4"] }

serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
companion-sync = { path = "../../../crates/companion-sync" }

tauri-plugin-notification = "=2.8.1"

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
winreg = "=0.56.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
